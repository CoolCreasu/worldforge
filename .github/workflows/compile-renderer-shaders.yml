name: Compile renderer shaders

on:
  pull_request:
    paths:
      - "assets/shaders/**"
      - "src/render/**"
      - "CMakeLists.txt"
      - ".github/workflows/compile-renderer-shaders.yml"

permissions:
  contents: write

jobs:
  compile-mesh-shader:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install SPIR-V shader compiler and validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools spirv-tools

      - name: Compile and validate the mesh vertex shader
        run: |
          glslangValidator -V --target-env vulkan1.0 -S vert \
            -o assets/shaders/Mesh.vert.spv assets/shaders/Mesh.vert.glsl
          spirv-val --target-env vulkan1.0 assets/shaders/Mesh.vert.spv

      - name: Commit the generated Vulkan shader
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git add assets/shaders/Mesh.vert.spv
          if git diff --cached --quiet -- assets/shaders/Mesh.vert.spv; then
            echo "Compiled shader is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add compiled mesh vertex shader"
          git push origin "HEAD:${BRANCH_NAME}"
