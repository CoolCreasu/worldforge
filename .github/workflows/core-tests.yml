name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-mesh-shader:
    name: Compile and validate Vulkan mesh shader
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install SPIR-V shader compiler and validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes glslang-tools spirv-tools

      - name: Compile and validate shader
        run: |
          glslangValidator -V --target-env vulkan1.0 -S vert \
            -o assets/shaders/Mesh.vert.spv assets/shaders/Mesh.vert.glsl
          spirv-val --target-env vulkan1.0 assets/shaders/Mesh.vert.spv

      - name: Commit generated shader to the pull request branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git add assets/shaders/Mesh.vert.spv
          if git diff --cached --quiet -- assets/shaders/Mesh.vert.spv; then
            echo "Compiled shader is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add compiled mesh vertex shader"
          git push origin "HEAD:${BRANCH_NAME}"

  core-tests:
    name: Core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure dependency-free core
        run: cmake -S . -B build -DWORLDFORGE_BUILD_APP=OFF -DWORLDFORGE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build build --config Debug

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure
